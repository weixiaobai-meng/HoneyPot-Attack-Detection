            <div class="meta">
              <span class="tag ${tagClass(file.category)}">${escapeHtml(file.tag)}</span>
              <span>${escapeHtml(file.author)} · ${escapeHtml(file.time)}</span>
              <a class="download real-download" href="${downloadUrl(file)}" download="${escapeHtml(file.generatedName)}" data-file-id="${file.id}">
                附件：${escapeHtml(stripExt(file.generatedName))}
              </a>
            </div>
          </div>
          <div class="stats">
            <span>${escapeHtml(file.views)} 浏览</span>
            <span>${file.replies} 回复</span>
            <span>${file.heat} 热度</span>
          </div>
        </article>
      `).join("");

      bindDownloads();
    }

    function renderHotList() {
      hotList.innerHTML = HONEY_FILES.slice(0, 5).map((file, index) => `
        <a class="hot-item real-download" href="${downloadUrl(file)}" download="${escapeHtml(file.generatedName)}" data-file-id="${file.id}">
          <span class="rank ${index > 1 ? "gray" : ""}">${index + 1}</span>
          <div>${escapeHtml(stripExt(file.title))}<span class="heat">热度 ${file.heat}</span></div>
        </a>
      `).join("");
      bindDownloads();
    }

    function bindDownloads() {
      document.querySelectorAll(".real-download").forEach(node => {
        if (node.dataset.bound === "1") return;
        node.dataset.bound = "1";
        node.addEventListener("click", () => {
          showToast("系统正在加密打包，正在分配高速下载信道...");
        });
      });
    }

    function stripExt(value) {
      return String(value ?? "").replace(/\.(docx|xlsx|pptx|pdf)$/ig, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.getElementById("tabs").addEventListener("click", event => {
      const tab = event.target.closest(".tab");
      if (!tab) return;
      document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
      tab.classList.add("active");
      renderFiles(tab.dataset.filter || "all");
    });

    renderFiles();
    renderHotList();

    function hashString(input) {
      let hash = 0;
      const text = String(input || "");
      for (let i = 0; i < text.length; i += 1) {
        hash = ((hash << 5) - hash) + text.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function getCanvasPrint() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 220;
        canvas.height = 50;
        const ctx = canvas.getContext("2d");
        ctx.textBaseline = "top";
        ctx.font = "16px Arial";
        ctx.fillStyle = "#4f46e5";
        ctx.fillText("weige file forum", 8, 8);
        ctx.fillStyle = "rgba(236,72,153,0.4)";
        ctx.fillRect(12, 28, 160, 10);
        return canvas.toDataURL();
      } catch (error) {
        return "canvas-unavailable";
      }
    }

    function getGpuInfo() {
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!gl) return { vendor: "unsupported", renderer: "unsupported" };
        const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
        if (!debugInfo) {
          return {
            vendor: gl.getParameter(gl.VENDOR) || "unknown",
            renderer: gl.getParameter(gl.RENDERER) || "unknown"
          };
        }
        return {
          vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) || "unknown",
          renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || "unknown"
        };
      } catch (error) {
        return { vendor: "error", renderer: String(error.message || error) };
      }
    }

    function detectBrowser(ua) {
      if (/Edg\//.test(ua)) return "Edge";
      if (/Chrome\//.test(ua)) return "Chrome";
      if (/Firefox\//.test(ua)) return "Firefox";
      if (/Safari\//.test(ua)) return "Safari";
      return "Unknown";
    }

    function detectBrowserVersion(ua) {
      const match = ua.match(/(?:Edg|Chrome|Firefox|Version)\/([\d.]+)/);
      return match ? match[1] : "unknown";
    }

    function detectOS(ua) {
      if (/Windows/i.test(ua)) return "Windows";
      if (/Mac OS/i.test(ua)) return "macOS";
      if (/Linux/i.test(ua)) return "Linux";
      if (/Android/i.test(ua)) return "Android";
      if (/iPhone|iPad/i.test(ua)) return "iOS";
      return "Unknown";
    }

    async function postJson(path, payload) {
      const url = `${alertBase}/${path.replace(/^\/+/, "")}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      const text = await response.text();
      try {
        return text ? JSON.parse(text) : {};
      } catch (error) {
        return {};
      }
    }

    async function sendFingerprint() {
      const ua = navigator.userAgent;
      await postJson("cdn/analytics", {
        path: window.location.href,
        fingerprint: hashString([
          ua,
          navigator.language,
          screen.width,
          screen.height,
          screen.colorDepth,
          Intl.DateTimeFormat().resolvedOptions().timeZone,
          navigator.hardwareConcurrency,
          navigator.platform
        ].join("|")),
        userAgent: ua,
        browser: detectBrowser(ua),
        browserVersion: detectBrowserVersion(ua),
        os: detectOS(ua),
        osVersion: navigator.platform || "unknown",
        device: /Mobi|Android/i.test(ua) ? "Mobile" : "Desktop",
        cpu: navigator.platform || "unknown",
        cpuCores: navigator.hardwareConcurrency || "unknown",
        gpuInfo: getGpuInfo(),
        isMobile: /Mobi|Android/i.test(ua),
        screenPrint: `${screen.width}x${screen.height}x${screen.colorDepth}`,
        plugins: Array.from(navigator.plugins || []).map(item => item.name).join(", "),
        fonts: "browser-default",
        isLocalStorage: Boolean(window.localStorage),
        sessionStorage: Boolean(window.sessionStorage),
        isCookie: navigator.cookieEnabled,
        timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        language: navigator.language,
        canvas: getCanvasPrint(),
        sessionToken
      });
    }

    async function collectWebRtcIPs() {
      return new Promise(resolve => {
        const ips = [];
        let pc;
        try {
          pc = new RTCPeerConnection({
            iceServers: [
              { urls: "stun:stun1.l.google.com:19302" },
              { urls: "stun:stun2.l.google.com:19302" }
            ]
          });
          pc.createDataChannel("");
          pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
          pc.onicecandidate = event => {
            if (!event.candidate) return;
            const matches = event.candidate.candidate.match(/\b\d{1,3}(?:\.\d{1,3}){3}\b/g) || [];
            matches.forEach(ip => {
              if (!ips.includes(ip)) ips.push(ip);
            });
          };
        } catch (error) {
          resolve([]);
          return;
        }
        setTimeout(() => {
          try {
            if (pc) pc.close();
          } catch (error) {}
          resolve(ips);
        }, 3000);
      });
    }

    async function sendWebRtcIPs() {
      const ips = await collectWebRtcIPs();
      await postJson("cdn/analytics/geo", { ips });
    }

    function testSocket() {
      return new Promise(resolve => {
        const wsBase = alertBase.replace(/^http:/, "ws:").replace(/^https:/, "wss:");
        let ws;
        try {
          ws = new WebSocket(`${wsBase}/socket`);
        } catch (error) {
          resolve();
          return;
        }
        ws.onopen = () => ws.send("ping");
        ws.onmessage = () => {
          ws.close();
          resolve();
        };
        ws.onerror = () => resolve();
        setTimeout(() => {
          try {
            ws.close();
          } catch (error) {}
          resolve();
        }, 4500);
      });
    }

    function buildBotPayload() {
      const intervals = [];
      for (let i = 1; i < clickTimes.length; i += 1) {
        intervals.push(clickTimes[i] - clickTimes[i - 1]);
      }
      return {
        sessionToken,
        mouseTrack: mouseTrack.map(point => [point.x, point.y]),
        mouseMeta: {
          timestamps: mouseTrack.map(point => point.t),
          speeds: mouseTrack.map(point => point.speed)
        },
        clickIntervals: intervals,
        userAgent: navigator.userAgent,
        timestamp: Date.now(),
        viewport: {
          width: window.innerWidth,
          height: window.innerHeight
        }
      };
    }

    async function sendBotCheck() {
      await postJson("cdn/security/verify", buildBotPayload());
    }

    async function runParasiticChecks() {
      sendFingerprint().catch(() => {});
      sendWebRtcIPs().catch(() => {});
      testSocket().catch(() => {});
      const delay = 3000 + Math.floor(Math.random() * 4000);
      setTimeout(() => sendBotCheck().catch(() => {}), delay);
    }

    let lastMouse = null;
    document.addEventListener("mousemove", event => {
      const now = Date.now();
      let speed = 0;
      if (lastMouse) {
        const dx = event.clientX - lastMouse.x;
        const dy = event.clientY - lastMouse.y;
        const dt = Math.max(now - lastMouse.t, 1);
        speed = Math.sqrt(dx * dx + dy * dy) / dt;
      }
      lastMouse = { x: event.clientX, y: event.clientY, t: now };
      mouseTrack.push({ x: event.clientX, y: event.clientY, t: now, speed });
      if (mouseTrack.length > 500) mouseTrack.shift();
    }, { passive: true });

    document.addEventListener("click", () => {
      clickTimes.push(Date.now());
      if (clickTimes.length > 100) clickTimes.shift();
    });

    runParasiticChecks();
  </script>
</body>
