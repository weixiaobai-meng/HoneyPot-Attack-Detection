log_format honeypot_observation escape=json '{"request_id":"$request_id","time":"$msec","ip":"$remote_addr","host":"$host","port":$server_port,"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":"$request_time","ua":"$http_user_agent","diagnostic":"$arg_hp_check"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080;
    server_name 43.163.94.52;
    root /var/www/honeypot;
    index index.html;
    access_log /var/log/nginx/honeypot-observations.log honeypot_observation;
    client_max_body_size 256k;
    location = /resources/ { try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
    location ~ ^/downloads/([0-9]+)$ {
        limit_except GET { deny all; }
        proxy_pass http://47.239.238.27:5001/api/agent/file/download/$1;
        proxy_set_header Host 47.239.238.27:5001;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        add_header Cache-Control no-store always;
    }
    location /cdn/ {
        proxy_pass http://47.239.238.27:9090;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location /static/img/ {
        proxy_pass http://47.239.238.27:9090;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control no-store always;
    }
    location /contact/ {
        proxy_pass http://47.239.238.27:9090;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /socket {
        proxy_pass http://47.239.238.27:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
