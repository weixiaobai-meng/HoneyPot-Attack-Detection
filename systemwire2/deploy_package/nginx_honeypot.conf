# Nginx 配置文件：蜜罐文件服务器
# 使用方法：
# 1. 将此文件复制到 /etc/nginx/sites-available/honeypot
# 2. 创建软链接：ln -s /etc/nginx/sites-available/honeypot /etc/nginx/sites-enabled/
# 3. 测试配置：nginx -t
# 4. 重启nginx：systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    
    # 配置支持的域名和IP地址
    server_name files.gzhu.edu.cn 119.28.137.174;
    
    # 日志文件
    access_log /var/log/nginx/honeypot_access.log;
    error_log /var/log/nginx/honeypot_error.log;
    
    # 安全头设置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 限制请求大小
    client_max_body_size 10M;
    
    # 代理到Flask应用
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 禁用缓存（确保实时响应）
        proxy_cache off;
        proxy_buffering off;
    }
    
    # 静态文件直接服务（可选优化）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 静态资源缓存
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
    
    # 健康检查端点
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # 拒绝访问敏感文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 拒绝访问备份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

