{% extends 'base.html' %}

{% block content %}
    <div id="header">
        <h2>
            <i class="fas fa-moon"></i>
            黑色主题测试页面
        </h2>
    </div>
    <div id="mid">
        <div class="welcome-content">
            <div class="welcome-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3>🎉 黑色主题效果测试</h3>
            <p>这是一个用于测试黑色主题和界面优化效果的页面。</p>
            
            <div class="feature-grid">
                <div class="feature-card">
                    <div class="feature-icon">
                        <i class="fas fa-adjust"></i>
                    </div>
                    <h4>黑色背景</h4>
                    <p>页面背景已更改为黑色，文字为白色，提供更好的视觉对比度</p>
                </div>
                
                <div class="feature-card">
                    <div class="feature-icon">
                        <i class="fas fa-text-height"></i>
                    </div>
                    <h4>字体优化</h4>
                    <p>字体大小和间距已调整，使内容更清晰易读</p>
                </div>
                
                <div class="feature-card">
                    <div class="feature-icon">
                        <i class="fas fa-expand-arrows-alt"></i>
                    </div>
                    <h4>布局调整</h4>
                    <p>顶部导航栏已放大，中间空白区域已减小，整体布局更紧凑</p>
                </div>
            </div>
            
            <div class="test-section">
                <h4>表单元素测试</h4>
                <form>
                    <div class="form-group">
                        <label for="test-input">测试输入框</label>
                        <input type="text" id="test-input" placeholder="请输入内容">
                    </div>
                    <div class="form-group">
                        <label for="test-select">测试下拉框</label>
                        <select id="test-select">
                            <option>选项1</option>
                            <option>选项2</option>
                            <option>选项3</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="button" class="btn btn-primary">主要按钮</button>
                        <button type="button" class="btn btn-secondary">次要按钮</button>
                        <button type="button" class="btn btn-danger">危险按钮</button>
                    </div>
                </form>
            </div>
            
            <div class="test-section">
                <h4>表格元素测试</h4>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>名称</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>测试项目1</td>
                            <td>进行中</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-primary">编辑</button>
                                <button type="button" class="btn btn-sm btn-danger">删除</button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>测试项目2</td>
                            <td>已完成</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-primary">编辑</button>
                                <button type="button" class="btn btn-sm btn-danger">删除</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <style>
        .welcome-content {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .welcome-icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .welcome-content h3 {
            font-size: 2.125rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, #3b82f6 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            font-family: var(--font-family);
            letter-spacing: -0.025em;
        }
        
        .welcome-content p {
            font-size: 1.1875rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            font-weight: 500;
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .feature-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem 1.5rem;
            text-align: center;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        
        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }
        
        .feature-icon {
            width: 4rem;
            height: 4rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, #3b82f6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: white;
            font-size: 1.5rem;
            box-shadow: var(--shadow-md);
        }
        
        .feature-card h4 {
            font-size: 1.3125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }
        
        .feature-card p {
            color: var(--text-secondary);
            margin: 0;
            font-size: 0.9375rem;
        }
        
        .test-section {
            margin-top: 3rem;
            text-align: left;
        }
        
        .test-section h4 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .test-section form {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }
        
        .test-section table {
            width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        
        @media (max-width: 768px) {
            .welcome-content h3 {
                font-size: 1.625rem;
            }
            
            .welcome-content p {
                font-size: 1.0625rem;
            }
            
            .feature-grid {
                grid-template-columns: 1fr;
            }
        }
        </style>
    </div>
{% endblock %}
