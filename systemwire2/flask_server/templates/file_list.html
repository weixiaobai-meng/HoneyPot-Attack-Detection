{% extends 'base.html' %}

{% block content %}
<div id="header">
    <h2>文件仓库</h2>
</div>
<div id="mid">
    <div class="table-container">
        <table class="modern-table" border="1">
            <thead>
                <tr>
                  <th>
                      <i class="fas fa-hashtag"></i>
                      ID
                  </th>
                  <th>
                      <i class="fas fa-file"></i>
                      文件名
                  </th>
                  <th>
                      <i class="fas fa-building"></i>
                      绑定信息
                  </th>
                  <th>
                      <i class="fas fa-envelope"></i>
                      告警邮箱
                  </th>
                  <th>
                      <i class="fas fa-download"></i>
                      下载
                  </th>
                  <th>
                      <i class="fas fa-cogs"></i>
                      操作
                  </th>
                </tr>
            </thead>
            <tbody>
                {% for file in file_list %}
                    <tr>
                        <td>
                            <span class="file-id">{{file.id}}</span>
                        </td>
                        <td>
                            <div class="file-info">
                                <div class="file-icon">
                                    <i class="fas fa-file"></i>
                                </div>
                                <span class="file-name">{{file.filename}}</span>
                            </div>
                        </td>
                        <td>
                            <span class="company-tag">{{file.company}}</span>
                        </td>
                        <td>
                            <div class="email-info">
                                <i class="fas fa-envelope"></i>
                                <span>{{file.email}}</span>
                            </div>
                        </td>
                        <td>
                            <form action="/file/download" method="GET" class="inline-form">
                                <input type="hidden" name="id" value="{{file.id}}">
                                <button type="submit" class="btn btn-primary btn-sm">
                                    <i class="fas fa-download"></i>
                                    下载文件
                                </button>
                            </form>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button type="button" class="btn btn-secondary btn-sm" onclick="sendFileToAgent({{file.id}}, '{{file.filename}}')">
                                    <i class="fas fa-paper-plane"></i>
                                    下发
                                </button>
                                <form class="delete-form inline-form" method="POST">
                                    <input type="hidden" name="id" value="{{ file.id }}">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="fas fa-trash"></i>
                                        删除
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                {% else %}
                <tr>
                    <td colspan="6" class="empty-state">
                        <div class="empty-content">
                            <i class="fas fa-file-slash"></i>
                            <h4>暂无文件</h4>
                            <p>还没有任何文件，请先上传一个。</p>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- 下发文件模态框 -->
<div id="sendModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>
                <i class="fas fa-paper-plane"></i>
                下发文件
            </h3>
            <button class="close" onclick="closeSendModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <p>文件: <span id="sendFileName" class="file-name-display"></span></p>
            <input type="hidden" id="sendFileId">
            
            <div class="form-group">
                <label for="agentSelect">
                    <i class="fas fa-satellite-dish"></i>
                    选择在线 Agent：
                </label>
                <select id="agentSelect" class="form-select">
                    <option value="">请选择 Agent</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="remotePath">
                    <i class="fas fa-folder-open"></i>
                    Agent 上的路径：
                </label>
                <input type="text" id="remotePath" class="form-input" placeholder="例如 C:\Users\Public\Documents">
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline" onclick="closeSendModal()">
                <i class="fas fa-times"></i>
                取消
            </button>
            <button type="button" class="btn btn-primary" onclick="sendFileToAgentFromModal()">
                <i class="fas fa-paper-plane"></i>
                发送
            </button>
        </div>
    </div>
</div>

<style>
/* 文件列表专用样式 */
.table-container {
    background: var(--bg-secondary);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-color);
    overflow: hidden;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
}

/* 表格滚动条样式 */
.table-container::-webkit-scrollbar {
    width: 8px;
}

.table-container::-webkit-scrollbar-track {
    background: var(--bg-tertiary);
    border-radius: 4px;
}

.table-container::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--primary-color) 0%, var(--primary-dark) 100%);
    border-radius: 4px;
    transition: var(--transition);
}

.table-container::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary-color) 100%);
}

.modern-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-secondary);
    font-family: var(--font-family);
    font-size: 0.875rem;
}

.modern-table thead {
    background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-primary) 100%);
    position: sticky;
    top: 0;
    z-index: 10;
}

.modern-table th {
    padding: 1rem 1.5rem;
    text-align: left;
    border-bottom: 2px solid var(--border-color);
    font-weight: 700;
    font-size: 0.8125rem;
    color: var(--text-primary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: var(--font-family);
}

.modern-table th i {
    margin-right: 0.5rem;
    color: var(--primary-color);
    font-size: 0.875rem;
}

.modern-table tbody tr {
    transition: var(--transition);
    border-bottom: 1px solid var(--border-light);
}

.modern-table tbody tr:hover {
    background: var(--bg-primary);
}

.modern-table tbody tr:last-child {
    border-bottom: none;
}

.modern-table td {
    padding: 1rem 1.5rem;
    vertical-align: middle;
    font-size: 0.875rem;
    color: var(--text-secondary);
}

/* 文件信息 */
.file-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.file-icon {
    width: 2rem;
    height: 2rem;
    background: linear-gradient(135deg, var(--primary-color) 0%, #3b82f6 100%);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 0.875rem;
}

.file-name {
    font-weight: 600; /* 加粗字体使其更清晰 */
    color: var(--text-primary);
    font-size: 0.875rem; /* 与表格字体大小保持一致 */
    font-family: var(--font-family-ui); /* 使用UI字体族确保清晰度 */
}

.file-id {
    font-family: 'Monaco', 'Menlo', monospace;
    background: var(--bg-primary);
    padding: 0.25rem 0.5rem;
    border-radius: var(--radius-sm);
    font-size: 0.875rem; /* 与表格字体大小保持一致 */
    color: var(--text-secondary);
    font-weight: 500; /* 增加字体粗细提高可读性 */
}

.company-tag {
    background: rgba(37, 99, 235, 0.1);
    color: var(--primary-color);
    padding: 0.375rem 0.75rem;
    border-radius: var(--radius-sm);
    font-size: 0.875rem; /* 与表格字体大小保持一致 */
    font-weight: 500;
    border: 1px solid rgba(37, 99, 235, 0.2);
    font-family: var(--font-family-ui); /* 使用UI字体族确保清晰度 */
}

.email-info {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-secondary);
    font-family: var(--font-family-ui); /* 使用UI字体族确保清晰度 */
}

.email-info i {
    color: var(--text-light);
    font-size: 0.875rem;
}

/* 操作按钮 */
.action-buttons {
    display: flex;
    gap: 0.5rem;
    align-items: center;
}

.inline-form {
    display: inline;
    margin: 0;
    padding: 0;
    background: none;
    border: none;
    box-shadow: none;
}

.btn {
    padding: 0.5rem 0.75rem;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.8125rem;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    text-decoration: none;
    min-width: auto;
}

.btn-sm {
    padding: 0.375rem 0.75rem;
    font-size: 0.75rem;
}

.btn-primary {
    background: var(--primary-color);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}

.btn-secondary {
    background: var(--secondary-color);
    color: white;
}

.btn-secondary:hover {
    background: #475569;
}

.btn-danger {
    background: var(--error-color);
    color: white;
}

.btn-danger:hover {
    background: #dc2626;
}

.btn-outline {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
}

.btn-outline:hover {
    background: var(--bg-primary);
    border-color: var(--primary-color);
    color: var(--primary-color);
}

/* 空状态 */
.empty-state {
    text-align: center;
    padding: 3rem 2rem;
}

.empty-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
}

.empty-content i {
    font-size: 3rem;
    color: var(--text-light);
}

.empty-content h4 {
    font-size: 1.25rem;
    color: var(--text-secondary);
    margin: 0;
}

.empty-content p {
    color: var(--text-light);
    margin: 0;
}

/* 模态框样式 */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    /* 默认隐藏模态框 */
    display: none;
    z-index: 9999;
    /* 使用Flexbox确保模态框居中 */
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: var(--bg-secondary);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    max-width: 500px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    /* 确保内容在模态框中正确显示 */
    margin: auto;
}

.modal-header {
    padding: 1.5rem 2rem 1rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h3 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.modal-body {
    padding: 1.5rem 2rem;
}

.modal-footer {
    padding: 1rem 2rem 1.5rem;
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;
}

.close {
    background: none;
    border: none;
    font-size: 1.25rem;
    cursor: pointer;
    color: var(--text-secondary);
    padding: 0.5rem;
    border-radius: var(--radius-sm);
    transition: var(--transition);
}

.close:hover {
    background: var(--bg-primary);
    color: var(--text-primary);
}

.file-name-display {
    font-weight: 600;
    color: var(--primary-color);
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: var(--text-primary);
    font-size: 0.875rem;
}

.form-select,
.form-input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    background: var(--bg-secondary);
    color: var(--text-primary);
    transition: var(--transition);
}

.form-select:focus,
.form-input:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

/* 响应式设计 */
@media (max-width: 768px) {
    .action-buttons {
        flex-direction: column;
        gap: 0.25rem;
    }
    
    .modern-table {
        font-size: 0.8125rem;
    }
    
    .modern-table th,
    .modern-table td {
        padding: 0.75rem 1rem;
    }
    
    .file-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
    }
}
</style>

<script src="{{ url_for('static', filename='js/file_list.js') }}"></script>
{% endblock %}
