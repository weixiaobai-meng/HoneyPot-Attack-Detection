{% extends 'base.html' %}

{% block content %}
    <div id="header">
        <h2>
            <i class="fas fa-building"></i>
            公司信息管理
        </h2>
    </div>
    <div id="mid">
        <div class="table-container">
            <table class="modern-table" border="1">
                <thead>
                    <tr>
                      <th>
                          <i class="fas fa-hashtag"></i>
                          ID
                      </th>
                      <th>
                          <i class="fas fa-building"></i>
                          公司名/描述
                      </th>
                      <th>
                          <i class="fas fa-key"></i>
                          API-KEY
                      </th>
                    </tr>
                </thead>
                <tbody>
                    {% for company in company_infos %}
                        <tr>
                            <td>
                                <span class="company-id">{{company.Id}}</span>
                            </td>
                            <td>
                                <div class="company-info">
                                    <div class="company-icon">
                                        <i class="fas fa-building"></i>
                                    </div>
                                    <span class="company-name">{{company.Description}}</span>
                                </div>
                            </td>
                            <td>
                                <div class="api-key-info">
                                    <code class="api-key-display">{{company.ApiKey[:16]}}...</code>
                                    <button type="button" class="btn btn-sm btn-outline" onclick="copyToClipboard('{{company.ApiKey}}')" title="复制 API Key">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="empty-state">
                            <div class="empty-content">
                                <i class="fas fa-building"></i>
                                <h4>暂无公司信息</h4>
                                <p>还没有任何公司信息，请先添加一个。</p>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
        <style>
        /* 公司列表专用样式 */
        .table-container {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
            max-height: calc(100vh - 250px);
            overflow-y: auto;
        }
        
        .table-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .table-container::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        
        .table-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border-radius: 4px;
            transition: var(--transition);
        }
        
        .table-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary-color) 100%);
        }
        
        .modern-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
            font-family: var(--font-family);
            font-size: 0.875rem;
        }
        
        .modern-table thead {
            background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-primary) 100%);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .modern-table th {
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            font-weight: 700;
            font-size: 0.8125rem;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-family: var(--font-family);
        }
        
        .modern-table th i {
            margin-right: 0.5rem;
            color: var(--primary-color);
            font-size: 0.875rem;
        }
        
        .modern-table tbody tr {
            transition: var(--transition);
            border-bottom: 1px solid var(--border-light);
        }
        
        .modern-table tbody tr:hover {
            background: var(--bg-primary);
            transform: translateX(2px);
        }
        
        .modern-table tbody tr:last-child {
            border-bottom: none;
        }
        
        .modern-table td {
            padding: 1rem 1.5rem;
            vertical-align: middle;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .company-id {
            font-family: var(--font-family);
            background: var(--bg-tertiary);
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.8125rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .company-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .company-icon {
            width: 2rem;
            height: 2rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.875rem;
        }
        
        .company-name {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .api-key-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .api-key-display {
            background: var(--bg-code);
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.8125rem;
            color: var(--text-code);
            font-family: var(--font-family);
            border: 1px solid var(--border-color);
            font-weight: 600;
        }
        
        .btn {
            padding: 0.375rem 0.75rem;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            text-decoration: none;
            min-width: auto;
        }
        
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        
        .btn-outline:hover {
            background: var(--bg-primary);
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-1px);
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
        }
        
        .empty-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .empty-content i {
            font-size: 3rem;
            color: var(--text-light);
        }
        
        .empty-content h4 {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin: 0;
            font-family: var(--font-family);
            text-transform: uppercase;
        }
        
        .empty-content p {
            color: var(--text-light);
            margin: 0;
        }
        
        @media (max-width: 768px) {
            .modern-table {
                font-size: 0.8125rem;
            }
            
            .modern-table th,
            .modern-table td {
                padding: 0.75rem 1rem;
            }
            
            .company-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
        </style>
    </div>
    
    <script>
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(function() {
            // 可以添加一个成功提示
            alert('API Key 已复制到剪贴板');
        }, function(err) {
            console.error('复制失败: ', err);
        });
    }
    </script>
    
    <script src="{{ url_for('static', filename='js/company.js') }}"></script>
{% endblock %}
