{% extends 'base.html' %}

{% block content %}
<div class="soc-form-page">
    <section class="form-hero">
        <div><div class="soc-eyebrow">File Honey Builder</div><h1>创建文件蜜点</h1><p>选择本地 docx/xlsx 等文件，写入 token 后生成可部署的诱饵文件。生成后可在文件仓库多选下发到在线 agent。</p></div>
        <a class="btn btn-secondary" href="{{ url_for('api.manage_file_list') }}"><i class="fas fa-folder"></i> 文件仓库</a>
    </section>

    <section class="form-card">
        <form id="uploadForm" method="POST">
            <div class="form-grid">
                <div class="form-group"><label for="honeypoint_name"><i class="fas fa-crosshairs"></i> 蜜点名称</label><input type="text" id="honeypoint_name" name="honeypoint_name" placeholder="例如 财务报表诱饵" required></div>
                <div class="form-group"><label for="email"><i class="fas fa-envelope"></i> 告警邮箱</label><input type="text" id="email" name="email" placeholder="接收文件 token 告警的邮箱" required></div>
                <div class="form-group wide"><label for="message"><i class="fas fa-building"></i> 绑定消息</label><input type="text" id="message" name="message" placeholder="例如 公司-部门-实验批次" required></div>
                <div class="form-group wide"><label for="file"><i class="fas fa-file-arrow-up"></i> 选择文件</label><input type="file" id="file" name="file" required><small class="help-text">创建完成后，文件蜜点告警来自 alert_server 的 `/static/img/logo-&lt;token&gt;.png` 回连，再由 systemwire2 拉取入库；历史 `/contact/&lt;token&gt;` 文件也兼容。</small></div>
            </div>

            <input type="text" id="source" name="source" value="1" required hidden>
            <input type="text" id="server" name="server" value="1" required hidden>
            <input type="text" id="format" name="format" value="1" required hidden>

            <div class="form-actions"><button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-wand-magic-sparkles"></i> 创建文件蜜点</button></div>
        </form>
    </section>
</div>

<style>
.soc-form-page { padding: 16px; }
.form-hero, .form-card { border: 1px solid var(--border-color); background: var(--bg-card); box-shadow: var(--shadow-md); border-radius: 28px; }
.form-hero { display: flex; justify-content: space-between; gap: 18px; align-items: center; padding: 24px; margin-bottom: 14px; }
.soc-eyebrow { color: var(--primary-color); font: 900 12px/1 var(--font-display); letter-spacing: .16em; text-transform: uppercase; }
.form-hero h1 { margin: 10px 0 8px; font: 900 40px/1 var(--font-display); letter-spacing: -.05em; }
.form-hero p { margin: 0; color: var(--text-secondary); line-height: 1.7; }
.form-card { padding: 24px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
@media (max-width: 760px) { .form-hero { flex-direction: column; align-items: stretch; } .form-grid { grid-template-columns: 1fr; } }
</style>

<script src="{{ url_for('static', filename='js/file_create.js') }}"></script>
{% endblock %}
